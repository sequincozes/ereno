# Network Configuration
goose.network.ethDst=01:0c:cd:01:2f:77
goose.network.ethSrc=01:0c:cd:01:2f:78
goose.network.ethType=0x000088b8
goose.network.TPID=0x8100

# GOOSE Protocol
goose.protocol.appId=0x00003001
goose.protocol.gocbRef=LD/LLN0$GO$gcbA
goose.protocol.datSet=LD/LLN0$IntLockA
goose.protocol.goID=IntLockA
goose.protocol.name=GOOSE

# Timing Parameters
goose.timing.minTime=100
goose.timing.maxTime=1000
goose.timing.timeToLive=11000

# Status Flags
goose.status.stNum=1
goose.status.sqNum=1
goose.status.cbStatus=0
goose.status.test=FALSE
goose.status.ndsCom=FALSE

# Dataset Configuration
goose.dataset.numEntries=25
goose.dataset.confRev=1
goose.flow.numberOfMessages=10000

# IED Configuration
goose.ied.name=defaultIED
goose.ied.timestamp=0

# Debugging
goose.debug.label=default_label

# Scenarios Configuration
scenario.generateArff=false
scenario.debug=false
scenario.path=src/datasets/
scenario.datasetName=gray-goose-run

# Balanced Dataset Generation (for BalancedSamambaiaScenario)
# Target number of malicious (attack) messages to generate
scenario.targetMaliciousMessages=100000
# Number of messages to generate per iteration
scenario.batchSize=90000
# Maximum iterations to prevent infinite loops
scenario.maxIterations=1000

# ---------------------------------------------------------------------------
# Run identity and reproducibility
# ---------------------------------------------------------------------------
# Seeds every random draw in the simulation. An integer makes the run exactly
# reproducible; "auto" draws one from the clock, logs it, and writes it into
# every row and into <dataset>.run.json - so even an auto run can be repeated
# afterwards by pasting the drawn value back here.
run.seed=20260101

# Identity written into every row. Leave blank to derive:
#   run.id         -> <scenario.id>-s<seed>
#   run.traceId    -> same as run.id (one publisher stream per run)
#   run.scenarioId -> SC-<attack variant>
run.id=
run.traceId=
run.scenarioId=

# Label for the substation/publisher configuration. Leave blank to derive from
# goose.protocol.goID. Change it whenever the goose.protocol.* or
# goose.network.* block above changes, so rows from different topologies stay
# distinguishable.
run.substationConfig=

# ---------------------------------------------------------------------------
# Oriented grayhole (UC09) attack parameters
# ---------------------------------------------------------------------------
# Variant: RANDOMIC_MESSAGE | RANDOMIC_BURST | DETERMINISTIC_BURST | FULLY_RANDOMIZED
# These three used to be hardcoded in OrientedGrayHoleCreator, so each variant
# required editing the source and rebuilding.
attack.orientedGrayhole.variant=FULLY_RANDOMIZED

# Percent chance of discarding, drawn per message (FULLY_RANDOMIZED,
# RANDOMIC_MESSAGE) or per state change (RANDOMIC_BURST). DETERMINISTIC_BURST
# ignores it and always drops, so its dataset rows report loss_rate=100.
attack.orientedGrayhole.discardRate=15

# Consecutive messages dropped per triggered burst. FULLY_RANDOMIZED ignores it
# and drops single messages, so its dataset rows report burst_size=1.
attack.orientedGrayhole.burstSize=5